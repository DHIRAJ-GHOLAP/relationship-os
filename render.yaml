# Render Blueprint Infrastructure-as-Code for Relationship OS
services:
  - type: web
    name: relationship-os-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: relationship-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/relationship_os.db
      - key: STORAGE_LOCAL_PATH
        value: /app/storage_uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://*.pages.dev,https://*.render.com,http://localhost:3000,http://localhost:8000"
      - key: OUTBOX_POLL_INTERVAL
        value: "1.0"
      - key: OUTBOX_MAX_RETRIES
        value: "5"
